spring:
  application:
    name: defomo
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: defomo-trade-execution-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

tossinvest:
  client-id: ${TOSSINVEST_CLIENT_ID:}
  client-secret: ${TOSSINVEST_CLIENT_SECRET:}
  rest-base-url: https://openapi.tossinvest.com
  websocket-url: wss://openapi-ws.tossinvest.com/ws/v1
  market-data:
    kr-symbols: ${TOSSINVEST_KR_SYMBOLS:}
    us-symbols: ${TOSSINVEST_US_SYMBOLS:}

defomo:
  kafka:
    trade-executions-topic: defomo.trade-executions
    trade-executions-partitions: 6
  market-data:
    batch-window-ms: 100
    max-trades-per-batch: 500
    shard-count: 6

logging:
  level:
    com.defomo.marketdata.adapter.out.tossinvest: INFO
